<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic-Tac-Toe Online: Pro Edition</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg: #0b0e14;
            --surface: #161b22;
            --border: #30363d;
            --accent-x: #00d2ff;
            --accent-o: #ff007a;
            --exclusive: #8b5cf6;
            --text: #e6edf3;
            --shadow-x: 0 0 20px rgba(0, 210, 255, 0.4);
            --shadow-o: 0 0 20px rgba(255, 0, 122, 0.4);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        body::before {
            content: ""; position: absolute; inset: 0;
            background: radial-gradient(circle at center, #1c2128 0%, #0b0e14 100%);
            z-index: -1;
        }

        /* ОНЛАЙН СТАТУС И ТАЙМЕР */
        .online-ui {
            position: fixed; top: 15px; left: 0; right: 0;
            display: flex; justify-content: space-between; padding: 0 20px;
            z-index: 100;
        }

        .timer-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 4px; background: rgba(255,255,255,0.1);
        }
        #timerFill {
            height: 100%; width: 0%; background: var(--exclusive); transition: width 1s linear;
        }

        .status-badge {
            background: var(--surface); border: 1px solid var(--border);
            padding: 8px 15px; border-radius: 12px; font-size: 0.75rem; font-weight: 800;
        }

        /* ОСНОВНОЙ КОНТЕЙНЕР */
        .main-container {
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            width: 100%; max-width: 500px; padding: 10px;
        }

        .turn-indicator {
            font-size: 0.9rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
            color: var(--exclusive); height: 20px;
        }

        .header {
            background: var(--surface); padding: 15px; border-radius: 20px;
            border: 1px solid var(--border); display: flex; width: 100%;
            justify-content: space-around; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .stat { text-align: center; }
        .stat-label { font-size: 0.6rem; text-transform: uppercase; opacity: 0.5; margin-bottom: 2px; }
        .stat-value { font-size: 1.4rem; font-weight: 800; }
        #scoreX { color: var(--accent-x); text-shadow: var(--shadow-x); }
        #scoreO { color: var(--accent-o); text-shadow: var(--shadow-o); }

        /* ВЫБОР РЕЖИМА (АДАПТИВНЫЙ) */
        .mode-selector {
            position: relative; background: var(--surface); height: 44px;
            border-radius: 12px; border: 1px solid var(--border);
            display: flex; width: 100%; overflow: hidden;
        }

        .mode-btn {
            position: relative; flex: 1; cursor: pointer; font-size: 0.65rem;
            font-weight: 800; z-index: 2; transition: 0.3s;
            color: rgba(230, 237, 243, 0.25); border: none; background: transparent;
            display: flex; align-items: center; justify-content: center; text-transform: uppercase;
        }

        .mode-btn.active { color: #fff; }
        .mode-glider {
            position: absolute; height: calc(100% - 8px); background: #2d333b;
            border-radius: 8px; top: 4px; transition: 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1; pointer-events: none;
        }

        /* ИГРОВОЕ ПОЛЕ */
        .game-area {
            position: relative; padding: 10px; background: rgba(48, 54, 61, 0.1); border-radius: 20px;
        }

        .board {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            width: 85vw; height: 85vw; max-width: 330px; max-height: 330px;
        }

        .cell {
            background: var(--surface); border-radius: 15px; border: 1px solid var(--border);
            display: flex; justify-content: center; align-items: center; cursor: pointer;
        }

        svg { width: 60%; height: 60%; fill: none; stroke-width: 10; stroke-linecap: round; }
        .x-path { stroke: var(--accent-x); filter: drop-shadow(0 0 8px var(--accent-x)); stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 0.4s ease forwards; }
        .o-path { stroke: var(--accent-o); filter: drop-shadow(0 0 8px var(--accent-o)); stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw 0.5s ease forwards; }
        @keyframes draw { to { stroke-dashoffset: 0; } }

        /* МОДАЛКИ */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 2000;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--surface); padding: 30px; border-radius: 25px;
            width: 85%; max-width: 350px; text-align: center; border: 1px solid var(--border);
        }

        input {
            background: #0b0e14; border: 1px solid var(--border); color: white;
            padding: 15px; border-radius: 12px; width: 100%; margin: 20px 0;
            text-align: center; font-size: 1rem; outline: none;
        }

        .btn-action {
            background: var(--exclusive); color: white; border: none; padding: 15px;
            border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer;
        }

        /* ОВЕРЛЕЙ */
        .win-overlay {
            position: fixed; inset: 0; background: rgba(11, 14, 20, 0.98);
            display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 1000;
        }
        .win-overlay.active { display: flex; }
    </style>
</head>
<body>

    <div class="timer-container"><div id="timerFill"></div></div>

    <div class="online-ui">
        <div class="status-badge" id="onlineIndicator">OFFLINE</div>
        <button class="status-badge" style="background:var(--exclusive); color:white; border:none;" onclick="openLogin()" id="mainOnlineBtn">ОНЛАЙН</button>
    </div>

    <div class="main-container">
        <div class="turn-indicator" id="turnText">КРЕСТИКИ-НОЛИКИ</div>

        <div class="header drop-anim">
            <div class="stat"><div class="stat-label" id="labelX">Игрок X</div><div class="stat-value" id="scoreX">0</div></div>
            <div class="stat"><div class="stat-label">Раунд</div><div class="stat-value" id="roundNum">1</div></div>
            <div class="stat"><div class="stat-label" id="labelO">Игрок O</div><div class="stat-value" id="scoreO">0</div></div>
        </div>

        <div class="mode-selector drop-anim" id="modeContainer">
            <div class="mode-glider" id="glider"></div>
            <button class="mode-btn active" data-mode="hard">Ultra</button>
            <button class="mode-btn" data-mode="med">Mid</button>
            <button class="mode-btn" data-mode="easy">Easy</button>
            <button class="mode-btn" data-mode="pvp">Друг</button>
            <button class="mode-btn" data-mode="god">Suicide</button>
        </div>

        <div class="game-area drop-anim">
            <div class="board" id="board">
                <div class="cell" data-idx="0"></div><div class="cell" data-idx="1"></div><div class="cell" data-idx="2"></div>
                <div class="cell" data-idx="3"></div><div class="cell" data-idx="4"></div><div class="cell" data-idx="5"></div>
                <div class="cell" data-idx="6"></div><div class="cell" data-idx="7"></div><div class="cell" data-idx="8"></div>
            </div>
        </div>

        <div style="opacity:0.3; font-size:0.6rem; letter-spacing:2px;" onclick="hardReset()">СБРОСИТЬ ВСЁ</div>
    </div>

    <div class="modal" id="loginModal">
        <div class="modal-content">
            <h3 style="margin:0; color:var(--exclusive)">ВХОД В СЕТЬ</h3>
            <input type="text" id="usernameInput" placeholder="Введите ваш ник">
            <button class="btn-action" onclick="startSearch()">Искать игру</button>
            <p id="searchStatus" style="font-size:0.7rem; opacity:0.5; margin-top:10px;"></p>
        </div>
    </div>

    <div class="win-overlay" id="winOverlay">
        <div id="winIcon" style="transform: scale(1.5);"></div>
        <div id="winText" style="font-size: 2rem; letter-spacing: 5px; margin: 30px 0; font-weight: 200;">ПОБЕДА</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBTcH3_tri2L7AHLh1e-YD-0s-QSthuE6Q",
            authDomain: "disk-c98ee.firebaseapp.com",
            projectId: "disk-c98ee",
            storageBucket: "disk-c98ee.appspot.com",
            messagingSenderId: "59577059636",
            appId: "1:59577059636:web:e98f456d054cc360747d61",
            databaseURL: "https://disk-c98ee-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let board = Array(9).fill(null);
        let turn = 'X', active = true, scoreX = 0, scoreO = 0, round = 1, currentMode = 'hard';
        let isOnline = false, mySymbol = null, gameId = null, myName = localStorage.getItem('ttt_nick') || "";
        let turnTimer = null, timeLeft = 15;

        const svgX = `<svg viewBox="0 0 100 100"><path class="x-path" d="M25,25 L75,75 M75,25 L25,75"/></svg>`;
        const svgO = `<svg viewBox="0 0 100 100"><circle class="o-path" cx="50" cy="50" r="35"/></svg>`;

        // СИНХРОНИЗАЦИЯ ГЛАЙДЕРА
        function syncGlider(btn) {
            const glider = document.getElementById('glider');
            glider.style.width = `${btn.offsetWidth}px`;
            glider.style.left = `${btn.offsetLeft}px`;
        }
        window.addEventListener('load', () => {
            syncGlider(document.querySelector('.mode-btn.active'));
            checkActiveSession();
        });

        // ПРОВЕРКА СЕССИИ
        function checkActiveSession() {
            const savedGame = localStorage.getItem('ttt_gameId');
            if(savedGame && myName) {
                gameId = savedGame;
                mySymbol = localStorage.getItem('ttt_symbol');
                listenToRoom();
            }
        }

        function openLogin() {
            if(isOnline) {
                if(confirm("Выйти из онлайн игры?")) {
                    localStorage.removeItem('ttt_gameId');
                    location.reload();
                }
                return;
            }
            if(myName) document.getElementById('usernameInput').value = myName;
            document.getElementById('loginModal').classList.add('active');
        }

        function startSearch() {
            const val = document.getElementById('usernameInput').value.trim();
            if(!val) return alert("Введите ник!");
            myName = val;
            localStorage.setItem('ttt_nick', myName);
            
            document.getElementById('searchStatus').innerText = "Поиск комнаты...";
            db.ref('rooms').once('value', snap => {
                let found = false;
                snap.forEach(room => {
                    if(room.val().status === 'waiting' && !found) {
                        found = true; joinRoom(room.key);
                    }
                });
                if(!found) createRoom();
            });
        }

        function createRoom() {
            gameId = db.ref('rooms').push().key;
            mySymbol = 'X';
            db.ref('rooms/' + gameId).set({
                p1: myName, p2: "", status: 'waiting', board: Array(9).fill(""), turn: 'X', round: 1, scoreX: 0, scoreO: 0, lastMoveTime: Date.now()
            });
            saveSession(); listenToRoom();
        }

        function joinRoom(id) {
            gameId = id;
            mySymbol = 'O';
            db.ref('rooms/' + gameId).update({ p2: myName, status: 'playing', lastMoveTime: Date.now() });
            saveSession(); listenToRoom();
        }

        function saveSession() {
            localStorage.setItem('ttt_gameId', gameId);
            localStorage.setItem('ttt_symbol', mySymbol);
        }

        function listenToRoom() {
            isOnline = true;
            document.getElementById('loginModal').classList.remove('active');
            document.getElementById('onlineIndicator').innerText = "ONLINE";
            document.getElementById('mainOnlineBtn').innerText = "ВЫЙТИ";
            document.getElementById('modeContainer').style.opacity = "0.2";
            document.getElementById('modeContainer').style.pointerEvents = "none";

            db.ref('rooms/' + gameId).on('value', snap => {
                const data = snap.val();
                if(!data) return;

                document.getElementById('labelX').innerText = data.p1 || "Поиск...";
                document.getElementById('labelO').innerText = data.p2 || "Поиск...";
                document.getElementById('scoreX').innerText = data.scoreX;
                document.getElementById('scoreO').innerText = data.scoreO;
                document.getElementById('roundNum').innerText = data.round;
                
                // Отрисовка поля
                data.board.forEach((v, i) => {
                    if(v && !board[i]) {
                        board[i] = v;
                        document.querySelector(`[data-idx="${i}"]`).innerHTML = v === 'X' ? svgX : svgO;
                    } else if(!v) {
                        document.querySelector(`[data-idx="${i}"]`).innerHTML = "";
                    }
                });
                board = data.board.map(v => v === "" ? null : v);
                turn = data.turn;
                
                updateTurnText();
                resetTimer();

                if(data.winner) handleWinner(data.winner);
            });
        }

        function updateTurnText() {
            const el = document.getElementById('turnText');
            if(turn === mySymbol) {
                el.innerText = "ВАШ ХОД"; el.style.color = "var(--exclusive)";
            } else {
                el.innerText = "ХОДИТ ПРОТИВНИК"; el.style.color = "rgba(255,255,255,0.3)";
            }
        }

        function resetTimer() {
            clearInterval(turnTimer);
            timeLeft = 15;
            if(!isOnline || !active) return;
            
            turnTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('timerFill').style.width = (timeLeft / 15 * 100) + "%";
                if(timeLeft <= 0) {
                    clearInterval(turnTimer);
                    if(turn === mySymbol) forceMove();
                }
            }, 1000);
        }

        function forceMove() {
            const avail = board.map((v, i) => v === null ? i : null).filter(v => v !== null);
            if(avail.length > 0) executeMove(avail[Math.floor(Math.random() * avail.length)], mySymbol);
        }

        function executeMove(i, p) {
            if(isOnline) {
                if(turn !== mySymbol || board[i]) return;
                const nb = board.map(v => v === null ? "" : v);
                nb[i] = mySymbol;
                db.ref('rooms/' + gameId).update({ board: nb, turn: mySymbol === 'X' ? 'O' : 'X', lastMoveTime: Date.now() });
                return;
            }
            // Локальная логика
            board[i] = p;
            document.querySelector(`[data-idx="${i}"]`).innerHTML = p === 'X' ? svgX : svgO;
            if(checkWin(board, p)) return handleWinner(p);
            if(board.every(v => v)) return handleWinner('draw');
            turn = turn === 'X' ? 'O' : 'X';
            if(turn === 'O' && currentMode !== 'pvp') setTimeout(aiAction, 500);
        }

        function handleWinner(p) {
            active = false; clearInterval(turnTimer);
            document.getElementById('winOverlay').classList.add('active');
            document.getElementById('winIcon').innerHTML = (p === 'draw' ? "" : (p === 'X' ? svgX : svgO));
            document.getElementById('winText').innerText = (p === 'draw' ? "НИЧЬЯ" : (isOnline ? (p === mySymbol ? "ПОБЕДА" : "ПОРАЖЕНИЕ") : "ПОБЕДА"));

            setTimeout(() => {
                document.getElementById('winOverlay').classList.remove('active');
                if(!isOnline) { clearField(); active = true; }
                else if(mySymbol === 'X') {
                    db.ref('rooms/' + gameId).update({
                        board: Array(9).fill(""), winner: null, turn: 'X', round: parseInt(document.getElementById('roundNum').innerText) + 1,
                        scoreX: p === 'X' ? scoreX + 1 : scoreX, scoreO: p === 'O' ? scoreO + 1 : scoreO
                    });
                    active = true;
                } else { active = true; }
            }, 2500);
        }

        function checkWin(b, p) {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return wins.some(w => w.every(i => b[i] === p));
        }

        // AI И ПРОЧЕЕ
        function aiAction() {
            const avail = board.map((v, i) => v === null ? i : null).filter(v => v !== null);
            if(avail.length === 0) return;
            executeMove(avail[0], 'O'); // Упрощено для примера, можно вернуть Minimax
        }

        function clearField() {
            board = Array(9).fill(null); turn = 'X';
            document.querySelectorAll('.cell').forEach(c => c.innerHTML = "");
        }

        function hardReset() { if(isOnline) return; location.reload(); }

        document.querySelectorAll('.cell').forEach(c => {
            c.addEventListener('click', () => executeMove(c.dataset.idx, turn));
        });

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                if(isOnline) return;
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                syncGlider(this);
                currentMode = this.dataset.mode;
                clearField();
            });
        });
    </script>
</body>
</html>
