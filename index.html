<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic-Tac-Toe Sentinel: Ultimate Edition</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg: #0b0e14;
            --surface: #161b22;
            --border: #30363d;
            --accent-x: #00d2ff;
            --accent-o: #ff007a;
            --exclusive: #8b5cf6;
            --text: #e6edf3;
            --shadow-x: 0 0 20px rgba(0, 210, 255, 0.4);
            --shadow-o: 0 0 20px rgba(255, 0, 122, 0.4);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        body::before {
            content: ""; position: absolute; inset: 0;
            background: radial-gradient(circle at center, #1c2128 0%, #0b0e14 100%);
            z-index: -1;
        }

        /* ТАЙМЕР */
        .timer-line {
            position: fixed; top: 0; left: 0; width: 100%; height: 4px;
            background: rgba(255,255,255,0.05); z-index: 1000;
        }
        #timerFill {
            height: 100%; width: 0%; background: var(--exclusive);
            box-shadow: 0 0 10px var(--exclusive); transition: width 1s linear;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        .online-status {
            position: fixed; top: 15px; width: 90%; max-width: 500px;
            display: flex; justify-content: space-between; align-items: center; z-index: 100;
        }

        .badge {
            background: var(--surface); border: 1px solid var(--border);
            padding: 8px 16px; border-radius: 12px; font-size: 0.7rem; font-weight: 800;
            letter-spacing: 1px; text-transform: uppercase;
        }

        .online-btn {
            background: var(--exclusive); color: white; border: none; cursor: pointer;
            transition: 0.3s; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }
        .online-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }

        /* КОНТЕЙНЕР ИГРЫ */
        .main-container {
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            width: 100%; max-width: 400px; padding: 20px;
        }

        #turnIndicator {
            font-size: 0.8rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: 2px; color: var(--exclusive); margin-bottom: 5px;
        }

        .scoreboard {
            background: var(--surface); padding: 15px 25px; border-radius: 20px;
            border: 1px solid var(--border); display: flex; width: 100%;
            justify-content: space-between; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .stat-item { text-align: center; }
        .stat-label { font-size: 0.6rem; opacity: 0.5; margin-bottom: 4px; text-transform: uppercase; }
        .stat-val { font-size: 1.5rem; font-weight: 800; }
        #scoreX { color: var(--accent-x); text-shadow: var(--shadow-x); }
        #scoreO { color: var(--accent-o); text-shadow: var(--shadow-o); }

        /* СЕЛЕКТОР РЕЖИМОВ */
        .mode-wrapper {
            position: relative; background: var(--surface); height: 48px;
            border-radius: 14px; border: 1px solid var(--border);
            display: flex; width: 100%; overflow: hidden;
        }
        .mode-tab {
            flex: 1; border: none; background: none; color: rgba(255,255,255,0.2);
            font-size: 0.65rem; font-weight: 800; cursor: pointer; z-index: 2;
            text-transform: uppercase; transition: 0.3s;
        }
        .mode-tab.active { color: #fff; }
        .glider {
            position: absolute; height: calc(100% - 10px); top: 5px;
            background: rgba(255,255,255,0.05); border-radius: 10px;
            transition: 0.4s cubic-bezier(0.25, 1, 0.5, 1); z-index: 1;
        }

        /* ПОЛЕ БОЯ */
        .board-container {
            background: rgba(255,255,255,0.02); padding: 12px; border-radius: 24px;
        }
        .grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
            width: 80vw; height: 80vw; max-width: 320px; max-height: 320px;
        }
        .cell {
            background: var(--surface); border-radius: 16px; border: 1px solid var(--border);
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Эффекты для ПК */
        @media (underline: none) and (hover: hover) {
            .cell:hover:not(.occupied) {
                background: #1c2128; border-color: #444d56; transform: scale(1.02);
            }
        }

        /* SVG АНИМАЦИИ */
        svg { width: 65%; height: 65%; fill: none; stroke-width: 10; stroke-linecap: round; }
        .x-path { stroke: var(--accent-x); filter: drop-shadow(0 0 8px var(--accent-x)); stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 0.4s ease forwards; }
        .o-path { stroke: var(--accent-o); filter: drop-shadow(0 0 8px var(--accent-o)); stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw 0.5s ease forwards; }
        @keyframes draw { to { stroke-dashoffset: 0; } }

        /* МОДАЛКИ */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.92);
            backdrop-filter: blur(15px); display: none; justify-content: center;
            align-items: center; z-index: 2000; padding: 20px;
        }
        .overlay.active { display: flex; animation: fadeIn 0.3s ease; }
        .card {
            background: var(--surface); padding: 35px; border-radius: 30px;
            width: 100%; max-width: 340px; text-align: center; border: 1px solid var(--border);
        }
        input {
            background: #0b0e14; border: 1px solid var(--border); color: #fff;
            padding: 16px; border-radius: 12px; width: 100%; margin: 20px 0;
            text-align: center; font-size: 1rem;
        }
        .primary-btn {
            background: var(--exclusive); color: #fff; border: none; padding: 16px;
            border-radius: 14px; width: 100%; font-weight: 800; cursor: pointer;
        }

        /* ЭКРАН ПОБЕДЫ */
        .victory-screen {
            position: fixed; inset: 0; background: var(--bg); display: none;
            flex-direction: column; justify-content: center; align-items: center; z-index: 1500;
        }
        .victory-screen.active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="timer-line"><div id="timerFill"></div></div>

    <div class="online-status">
        <div class="badge" id="netLabel">OFFLINE</div>
        <button class="badge online-btn" onclick="toggleOnline()" id="netBtn">ОНЛАЙН</button>
    </div>

    <div class="main-container">
        <div id="turnIndicator">ОЖИДАНИЕ ХОДА</div>

        <div class="scoreboard">
            <div class="stat-item"><div class="stat-label" id="p1Label">ИГРОК X</div><div class="stat-val" id="scoreX">0</div></div>
            <div class="stat-item"><div class="stat-label">РАУНД</div><div class="stat-val" id="roundNum">1</div></div>
            <div class="stat-item"><div class="stat-label" id="p2Label">ИГРОК O</div><div class="stat-val" id="scoreO">0</div></div>
        </div>

        <div class="mode-wrapper" id="modeBox">
            <div class="glider" id="glider"></div>
            <button class="mode-tab active" data-mode="hard">ULTRA</button>
            <button class="mode-tab" data-mode="med">MID</button>
            <button class="mode-tab" data-mode="easy">EASY</button>
            <button class="mode-tab" data-mode="pvp">FRIEND</button>
            <button class="mode-tab" data-mode="god">SUICIDE</button>
        </div>

        <div class="board-container">
            <div class="grid" id="grid">
                <div class="cell" data-idx="0"></div><div class="cell" data-idx="1"></div><div class="cell" data-idx="2"></div>
                <div class="cell" data-idx="3"></div><div class="cell" data-idx="4"></div><div class="cell" data-idx="5"></div>
                <div class="cell" data-idx="6"></div><div class="cell" data-idx="7"></div><div class="cell" data-idx="8"></div>
            </div>
        </div>

        <div style="opacity: 0.2; font-size: 0.6rem; letter-spacing: 2px; cursor: pointer" onclick="resetAll()">ПОЛНЫЙ СБРОС</div>
    </div>

    <div class="overlay" id="authModal">
        <div class="card">
            <h2 style="margin:0; color:var(--exclusive)">ONLINE LOBBY</h2>
            <input type="text" id="nickInput" placeholder="Введите ваш ник" maxlength="12">
            <button class="primary-btn" onclick="findGame()">НАЙТИ ИГРОКА</button>
            <p id="searchInfo" style="margin-top:15px; font-size:0.7rem; opacity:0.5"></p>
        </div>
    </div>

    <div class="victory-screen" id="vicScreen">
        <div id="vicIcon" style="transform:scale(1.8)"></div>
        <h1 id="vicText" style="margin-top:50px; letter-spacing:5px; font-weight:200"></h1>
        <p style="opacity:0.3; text-transform:uppercase; font-size:0.7rem; letter-spacing:2px">Следующий раунд...</p>
    </div>

    <script>
        const config = {
            apiKey: "AIzaSyBTcH3_tri2L7AHLh1e-YD-0s-QSthuE6Q",
            authDomain: "disk-c98ee.firebaseapp.com",
            projectId: "disk-c98ee",
            storageBucket: "disk-c98ee.appspot.com",
            messagingSenderId: "59577059636",
            appId: "1:59577059636:web:e98f456d054cc360747d61",
            databaseURL: "https://disk-c98ee-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(config);
        const db = firebase.database();

        let board = Array(9).fill(null);
        let turn = 'X', active = true, scoreX = 0, scoreO = 0, round = 1, currentMode = 'hard';
        let isOnline = false, mySym = null, gameId = null, nick = localStorage.getItem('ttt_name') || "";
        let timer = null, timeLeft = 15;

        const svgX = `<svg viewBox="0 0 100 100"><path class="x-path" d="M25,25 L75,75 M75,25 L25,75"/></svg>`;
        const svgO = `<svg viewBox="0 0 100 100"><circle class="o-path" cx="50" cy="50" r="35"/></svg>`;

        // ИНИЦИАЛИЗАЦИЯ
        window.onload = () => {
            updateGlider(document.querySelector('.mode-tab.active'));
            const savedRoom = localStorage.getItem('ttt_room');
            if(savedRoom && nick) {
                gameId = savedRoom; mySym = localStorage.getItem('ttt_sym');
                startOnline();
            }
        };

        function updateGlider(btn) {
            const g = document.getElementById('glider');
            g.style.width = btn.offsetWidth + "px";
            g.style.left = btn.offsetLeft + "px";
        }

        // ОНЛАЙН ЛОГИКА
        function toggleOnline() {
            if(isOnline) { if(confirm("Выйти?")) { localStorage.removeItem('ttt_room'); location.reload(); } }
            else { if(nick) document.getElementById('nickInput').value = nick; document.getElementById('authModal').classList.add('active'); }
        }

        function findGame() {
            const val = document.getElementById('nickInput').value.trim();
            if(!val) return;
            nick = val; localStorage.setItem('ttt_name', nick);
            document.getElementById('searchInfo').innerText = "Поиск свободного игрока...";
            
            db.ref('rooms').once('value', s => {
                let found = false;
                s.forEach(r => { if(r.val().status === 'waiting' && !found) { found = true; joinRoom(r.key); } });
                if(!found) createRoom();
            });
        }

        function createRoom() {
            gameId = db.ref('rooms').push().key; mySym = 'X';
            db.ref('rooms/' + gameId).set({ p1: nick, p2: "", status: 'waiting', board: Array(9).fill(""), turn: 'X', round: 1, scoreX:0, scoreO:0 });
            localStorage.setItem('ttt_room', gameId); localStorage.setItem('ttt_sym', 'X');
            startOnline();
        }

        function joinRoom(id) {
            gameId = id; mySym = 'O';
            db.ref('rooms/' + gameId).update({ p2: nick, status: 'playing' });
            localStorage.setItem('ttt_room', gameId); localStorage.setItem('ttt_sym', 'O');
            startOnline();
        }

        function startOnline() {
            isOnline = true;
            document.getElementById('authModal').classList.remove('active');
            document.getElementById('netLabel').innerText = "ONLINE";
            document.getElementById('netBtn').innerText = "ВЫХОД";
            document.getElementById('modeBox').style.pointerEvents = "none";
            document.getElementById('modeBox').style.opacity = "0.3";

            db.ref('rooms/' + gameId).on('value', s => {
                const data = s.val(); if(!data) return;
                
                document.getElementById('p1Label').innerText = data.p1 || "ОЖИДАНИЕ";
                document.getElementById('p2Label').innerText = data.p2 || "ПОИСК...";
                document.getElementById('scoreX').innerText = data.scoreX;
                document.getElementById('scoreO').innerText = data.scoreO;
                document.getElementById('roundNum').innerText = data.round;
                
                // Синхронизация поля
                data.board.forEach((v, i) => {
                    const cell = document.querySelector(`[data-idx="${i}"]`);
                    if(v && !board[i]) {
                        board[i] = v; cell.innerHTML = v === 'X' ? svgX : svgO; cell.classList.add('occupied');
                    } else if(!v) {
                        cell.innerHTML = ""; cell.classList.remove('occupied');
                    }
                });
                board = data.board.map(v => v === "" ? null : v);
                turn = data.turn;

                updateStatusUI();
                startTimer();
                if(data.winner) showWin(data.winner);
            });
        }

        function updateStatusUI() {
            const el = document.getElementById('turnIndicator');
            if(turn === mySym) { el.innerText = "ВАШ ХОД"; el.style.color = "var(--exclusive)"; }
            else { el.innerText = "ХОД ПРОТИВНИКА"; el.style.color = "rgba(255,255,255,0.2)"; }
        }

        // ТАЙМЕР
        function startTimer() {
            clearInterval(timer); timeLeft = 15;
            if(!active) return;
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timerFill').style.width = (timeLeft / 15 * 100) + "%";
                if(timeLeft <= 0) { clearInterval(timer); if(turn === mySym) autoMove(); }
            }, 1000);
        }

        function autoMove() {
            const avail = board.map((v, i) => v === null ? i : null).filter(v => v !== null);
            if(avail.length > 0) handleMove(avail[Math.floor(Math.random()*avail.length)]);
        }

        // ХОД ИГРОКА
        function handleMove(i) {
            if(!active || board[i]) return;

            if(isOnline) {
                if(turn !== mySym) return;
                const nb = board.map(v => v === null ? "" : v);
                nb[i] = mySym;
                db.ref('rooms/' + gameId).update({ board: nb, turn: mySym === 'X' ? 'O' : 'X' });
            } else {
                board[i] = turn;
                const cell = document.querySelector(`[data-idx="${i}"]`);
                cell.innerHTML = turn === 'X' ? svgX : svgO;
                cell.classList.add('occupied');

                if(checkWin(board, turn)) return showWin(turn);
                if(board.every(v => v)) return showWin('draw');

                turn = turn === 'X' ? 'O' : 'X';
                if(turn === 'O' && currentMode !== 'pvp') {
                    active = false;
                    setTimeout(aiStep, 600);
                }
            }
        }

        function aiStep() {
            let idx;
            if(currentMode === 'easy') idx = randomIdx();
            else if(currentMode === 'god') idx = antiMinimax(board, 'O').index;
            else idx = minimax(board, 'O').index;
            
            active = true;
            handleMove(idx);
        }

        function randomIdx() {
            const avail = board.map((v, i) => v === null ? i : null).filter(v => v !== null);
            return avail[Math.floor(Math.random() * avail.length)];
        }

        // ЭКРАН ПОБЕДЫ
        function showWin(p) {
            active = false; clearInterval(timer);
            const screen = document.getElementById('vicScreen');
            const icon = document.getElementById('vicIcon');
            const text = document.getElementById('vicText');

            screen.classList.add('active');
            if(p === 'draw') { icon.innerHTML = ""; text.innerText = "НИЧЬЯ"; }
            else {
                icon.innerHTML = p === 'X' ? svgX : svgO;
                if(isOnline) text.innerText = p === mySym ? "ПОБЕДА" : "ПРОИГРЫШ";
                else if(currentMode === 'god') text.innerText = p === 'X' ? "ТЫ ПРОИГРАЛ" : "ТЫ ПОБЕДИЛ";
                else text.innerText = p === 'X' ? "ПОБЕДА X" : "ПОБЕДА O";
            }

            setTimeout(() => {
                screen.classList.remove('active');
                if(!isOnline) { resetField(); active = true; }
                else if(mySym === 'X') {
                    db.ref('rooms/' + gameId).update({
                        board: Array(9).fill(""), winner: null, turn: 'X',
                        round: parseInt(document.getElementById('roundNum').innerText) + 1,
                        scoreX: p === 'X' ? scoreX + 1 : scoreX,
                        scoreO: p === 'O' ? scoreO + 1 : scoreO
                    });
                    active = true;
                } else { active = true; }
            }, 2500);
        }

        // АЛГОРИТМЫ
        function checkWin(b, p) {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return wins.some(w => w.every(i => b[i] === p));
        }

        function minimax(nb, p) {
            const avail = nb.map((v, i) => v === null ? i : null).filter(v => v !== null);
            if(checkWin(nb, 'X')) return { score: -10 };
            if(checkWin(nb, 'O')) return { score: 10 };
            if(avail.length === 0) return { score: 0 };
            const moves = [];
            for(let i=0; i<avail.length; i++) {
                let m = { index: avail[i] }; nb[avail[i]] = p;
                m.score = minimax(nb, p === 'O' ? 'X' : 'O').score;
                nb[avail[i]] = null; moves.push(m);
            }
            let best;
            if(p === 'O') { let bs = -Infinity; moves.forEach((m, i) => { if(m.score > bs) { bs = m.score; best = i; } }); }
            else { let bs = Infinity; moves.forEach((m, i) => { if(m.score < bs) { bs = m.score; best = i; } }); }
            return moves[best];
        }

        function antiMinimax(nb, p) {
            const avail = nb.map((v, i) => v === null ? i : null).filter(v => v !== null);
            if(checkWin(nb, 'X')) return { score: 10 };
            if(checkWin(nb, 'O')) return { score: -10 };
            if(avail.length === 0) return { score: 0 };
            const moves = [];
            for(let i=0; i<avail.length; i++) {
                let m = { index: avail[i] }; nb[avail[i]] = p;
                m.score = antiMinimax(nb, p === 'O' ? 'X' : 'O').score;
                nb[avail[i]] = null; moves.push(m);
            }
            let best;
            if(p === 'O') { let bs = -Infinity; moves.forEach((m, i) => { if(m.score > bs) { bs = m.score; best = i; } }); }
            else { let bs = Infinity; moves.forEach((m, i) => { if(m.score < bs) { bs = m.score; best = i; } }); }
            return moves[best];
        }

        function resetField() {
            board = Array(9).fill(null); turn = 'X';
            document.querySelectorAll('.cell').forEach(c => { c.innerHTML = ""; c.classList.remove('occupied'); });
        }

        function resetAll() { if(!isOnline) location.reload(); }

        // ИВЕНТЫ
        document.querySelectorAll('.cell').forEach(c => c.onclick = () => handleMove(c.dataset.idx));
        document.querySelectorAll('.mode-tab').forEach(t => {
            t.onclick = function() {
                if(isOnline) return;
                document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
                this.classList.add('active'); updateGlider(this);
                currentMode = this.dataset.mode; resetField();
                scoreX = 0; scoreO = 0; round = 1;
                document.getElementById('scoreX').innerText = 0;
                document.getElementById('scoreO').innerText = 0;
                document.getElementById('roundNum').innerText = 1;
            };
        });
    </script>
</body>
</html>
