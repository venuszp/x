<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крестики-Нолики: Sentinel Online</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg: #0b0e14;
            --surface: #161b22;
            --border: #30363d;
            --accent-x: #00d2ff;
            --accent-o: #ff007a;
            --sentinel: #f59e0b;
            --exclusive: #8b5cf6;
            --text: #e6edf3;
            --shadow-x: 0 0 20px rgba(0, 210, 255, 0.4);
            --shadow-o: 0 0 20px rgba(255, 0, 122, 0.4);
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, #1c2128 0%, #0b0e14 100%);
            z-index: -1;
        }

        .online-btn-container {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
        }

        .online-trigger {
            background: var(--exclusive);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.8rem;
        }

        .online-trigger:hover { transform: scale(1.05); filter: brightness(1.2); }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        /* АНИМАЦИЯ СПУСКА */
        .drop-anim {
            opacity: 0;
            transform: translateY(-50px);
            animation: elementDrop 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .header { animation-delay: 0.1s; }
        .mode-selector { animation-delay: 0.2s; }
        .game-area { animation-delay: 0.3s; }
        .footer-controls { animation-delay: 0.4s; }

        @keyframes elementDrop { to { opacity: 1; transform: translateY(0); } }

        /* ПАНЕЛЬ СЧЕТА */
        .header {
            background: var(--surface);
            padding: 20px 50px;
            border-radius: 24px;
            border: 1px solid var(--border);
            display: flex;
            gap: 60px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            min-width: 300px;
            justify-content: space-around;
        }

        .stat { text-align: center; }
        .stat-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.5; margin-bottom: 5px; max-width: 80px; overflow: hidden; text-overflow: ellipsis; }
        .stat-value { font-size: 1.8rem; font-weight: 800; }
        #scoreX { color: var(--accent-x); text-shadow: var(--shadow-x); }
        #scoreO { color: var(--accent-o); text-shadow: var(--shadow-o); }

        .round-box { position: relative; overflow: hidden; height: 40px; display: flex; align-items: center; justify-content: center; }
        #roundNum.round-change { animation: roundSlide 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes roundSlide { 0% { transform: translateY(-100%); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

        /* ВЫБОР РЕЖИМА */
        .mode-selector {
            position: relative;
            background: var(--surface);
            padding: 0; height: 54px; border-radius: 16px; border: 1px solid var(--border);
            display: flex; align-items: stretch; overflow: hidden; width: 540px;
        }

        .mode-btn {
            position: relative; flex: 1; cursor: pointer; font-size: 0.7rem; font-weight: 800; z-index: 2;
            transition: all 0.3s ease; color: rgba(230, 237, 243, 0.25); border: none; background: transparent;
            display: flex; align-items: center; justify-content: center; outline: none; text-transform: uppercase;
        }

        .mode-btn.active { color: #fff; }
        .mode-glider { position: absolute; height: calc(100% - 10px); background: #2d333b; border-radius: 12px; top: 5px; transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); z-index: 1; pointer-events: none; }

        /* ИГРОВОЕ ПОЛЕ */
        .game-area { position: relative; padding: 15px; background: rgba(48, 54, 61, 0.1); border-radius: 28px; }
        .board { display: grid; grid-template-columns: repeat(3, 110px); grid-template-rows: repeat(3, 110px); gap: 15px; }
        .cell { background: var(--surface); border-radius: 18px; border: 1px solid var(--border); display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .cell:hover:not(.occupied) { transform: scale(1.05); background: #1c2128; border-color: #8b949e; }

        /* SVG */
        svg { width: 65px; height: 65px; fill: none; stroke-width: 9; stroke-linecap: round; }
        .x-path { stroke: var(--accent-x); filter: drop-shadow(0 0 10px var(--accent-x)); stroke-dasharray: 100; stroke-dashoffset: 100; animation: drawPath 0.4s ease forwards; }
        .o-path { stroke: var(--accent-o); filter: drop-shadow(0 0 10px var(--accent-o)); stroke-dasharray: 220; stroke-dashoffset: 220; animation: drawPath 0.5s ease-out forwards; }
        @keyframes drawPath { to { stroke-dashoffset: 0; } }

        /* МОДАЛКИ */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal.active { display: flex; animation: fadeIn 0.3s ease; }
        .modal-content { background: var(--surface); padding: 40px; border-radius: 30px; border: 1px solid var(--border); width: 320px; text-align: center; }
        
        input { background: #0b0e14; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 10px; width: 80%; margin: 20px 0; outline: none; text-align: center; font-weight: bold; }

        .btn-main { background: var(--exclusive); color: white; border: none; padding: 12px 30px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; }

        /* ОВЕРЛЕЙ ПОБЕДЫ */
        .win-overlay { position: fixed; inset: 0; background: rgba(11, 14, 20, 0.96); backdrop-filter: blur(15px); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .win-overlay.active { display: flex; animation: fadeIn 0.4s ease; }

        .footer-controls { display: flex; gap: 20px; align-items: center; }
        .icon-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; opacity: 0.6; transition: 0.3s; }
        .icon-btn:hover { opacity: 1; border-color: var(--exclusive); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="online-btn-container drop-anim">
        <button class="online-trigger" id="onlineToggle" onclick="openLogin()">Играть Онлайн</button>
    </div>

    <div class="main-container">
        <div class="header drop-anim">
            <div class="stat"><div class="stat-label" id="labelX">Игрок X</div><div class="stat-value" id="scoreX">0</div></div>
            <div class="stat">
                <div class="stat-label">Раунд</div>
                <div class="round-box"><div class="stat-value" id="roundNum">1</div></div>
            </div>
            <div class="stat"><div class="stat-label" id="labelO">Игрок O</div><div class="stat-value" id="scoreO">0</div></div>
        </div>

        <div class="mode-selector drop-anim" id="modeContainer">
            <div class="mode-glider" id="glider"></div>
            <button class="mode-btn active" data-mode="hard">Ультра</button>
            <button class="mode-btn" data-mode="med">Средний</button>
            <button class="mode-btn" data-mode="easy">Легкий</button>
            <button class="mode-btn" data-mode="pvp">Друг</button>
            <button class="mode-btn" data-mode="god">Суицид</button>
        </div>

        <div class="game-area drop-anim" id="gameArea">
            <div class="board" id="board">
                <div class="cell" data-idx="0"></div><div class="cell" data-idx="1"></div><div class="cell" data-idx="2"></div>
                <div class="cell" data-idx="3"></div><div class="cell" data-idx="4"></div><div class="cell" data-idx="5"></div>
                <div class="cell" data-idx="6"></div><div class="cell" data-idx="7"></div><div class="cell" data-idx="8"></div>
            </div>
        </div>

        <div class="footer-controls drop-anim">
            <button class="icon-btn" onclick="toggleModal('infoModal')">?</button>
            <button style="background:none; border:none; color:#fff; opacity:0.3; cursor:pointer; font-size:0.7rem;" onclick="hardReset()">СБРОСИТЬ</button>
        </div>
    </div>

    <div class="modal" id="loginModal">
        <div class="modal-content">
            <h2 style="color:var(--exclusive)">ONLINE LOBBY</h2>
            <input type="text" id="usernameInput" placeholder="Ваш никнейм" maxlength="12">
            <button class="btn-main" onclick="startOnlineSearch()">Найти игру</button>
            <p id="statusText" style="font-size: 0.7rem; margin-top: 15px; opacity: 0.5;">Введите ник для поиска соперника</p>
        </div>
    </div>

    <div class="modal" id="infoModal">
        <div class="modal-content">
            <h2 style="color:var(--exclusive)">ПРАВИЛА</h2>
            <p id="infoText">Режим Суицид: заставь бота победить, чтобы выиграть самому!</p>
            <button class="btn-main" onclick="toggleModal('infoModal')">Понятно</button>
        </div>
    </div>

    <div class="win-overlay" id="winOverlay">
        <div id="winIcon" style="transform: scale(1.5);"></div>
        <div id="winText" style="font-size: 2.5rem; letter-spacing: 8px; margin: 40px 0; font-weight: 200;">ПОБЕДА</div>
        <div style="opacity:0.4; text-transform:uppercase; letter-spacing:3px;">Новый раунд через мгновение...</div>
    </div>

    <script>
        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyBTcH3_tri2L7AHLh1e-YD-0s-QSthuE6Q",
            authDomain: "disk-c98ee.firebaseapp.com",
            projectId: "disk-c98ee",
            storageBucket: "disk-c98ee.appspot.com",
            messagingSenderId: "59577059636",
            appId: "1:59577059636:web:e98f456d054cc360747d61",
            databaseURL: "https://disk-c98ee-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // GAME STATE
        const cells = document.querySelectorAll('.cell');
        const glider = document.getElementById('glider');
        const modeBtns = document.querySelectorAll('.mode-btn');
        const roundNum = document.getElementById('roundNum');
        const winOverlay = document.getElementById('winOverlay');
        const winIcon = document.getElementById('winIcon');
        
        let board = Array(9).fill(null);
        let turn = 'X', active = true, scoreX = 0, scoreO = 0, round = 1, currentMode = 'hard';
        let isOnline = false, mySymbol = null, gameId = null, myName = "";

        const svgX = `<svg viewBox="0 0 100 100"><path class="x-path" d="M25,25 L75,75 M75,25 L25,75"/></svg>`;
        const svgO = `<svg viewBox="0 0 100 100"><circle class="o-path" cx="50" cy="50" r="35"/></svg>`;

        // UI HELPERS
        window.addEventListener('load', () => syncGlider(document.querySelector('.mode-btn.active')));
        function syncGlider(btn) { glider.style.width = `${btn.offsetWidth}px`; glider.style.left = `${btn.offsetLeft}px`; }
        function toggleModal(id) { document.getElementById(id).classList.toggle('active'); }

        // ONLINE LOGIC
        function openLogin() { if(!isOnline) toggleModal('loginModal'); else location.reload(); }

        function startOnlineSearch() {
            myName = document.getElementById('usernameInput').value.trim();
            if(!myName) return alert("Введите ник!");
            
            document.getElementById('statusText').innerText = "Поиск свободного игрока...";
            
            const roomsRef = db.ref('rooms');
            roomsRef.once('value', snapshot => {
                let found = false;
                snapshot.forEach(room => {
                    const data = room.val();
                    if(data.status === 'waiting' && !found) {
                        joinRoom(room.key);
                        found = true;
                    }
                });
                if(!found) createRoom();
            });
        }

        function createRoom() {
            gameId = db.ref('rooms').push().key;
            mySymbol = 'X';
            db.ref('rooms/' + gameId).set({
                p1: myName, p2: "", status: 'waiting', board: Array(9).fill(""), turn: 'X', round: 1, scoreX: 0, scoreO: 0
            });
            listenToRoom();
        }

        function joinRoom(id) {
            gameId = id;
            mySymbol = 'O';
            db.ref('rooms/' + gameId).update({ p2: myName, status: 'playing' });
            listenToRoom();
        }

        function listenToRoom() {
            toggleModal('loginModal');
            document.getElementById('onlineToggle').innerText = "Выйти из Online";
            document.getElementById('onlineToggle').style.background = "#ef4444";
            isOnline = true;
            document.getElementById('modeContainer').style.opacity = "0.3";
            document.getElementById('modeContainer').style.pointerEvents = "none";

            db.ref('rooms/' + gameId).on('value', snapshot => {
                const data = snapshot.val();
                if(!data) return;
                
                // Update Players Names
                document.getElementById('labelX').innerText = data.p1 || "Ожидание...";
                document.getElementById('labelO').innerText = data.p2 || "Поиск...";
                
                // Update Board
                data.board.forEach((val, i) => {
                    if(val && !board[i]) {
                        board[i] = val;
                        cells[i].innerHTML = val === 'X' ? svgX : svgO;
                        cells[i].classList.add('occupied');
                    } else if (!val) {
                        cells[i].innerHTML = "";
                        cells[i].classList.remove('occupied');
                    }
                });
                board = data.board.map(v => v === "" ? null : v);
                
                // Game logic
                turn = data.turn;
                round = data.round;
                scoreX = data.scoreX;
                scoreO = data.scoreO;
                document.getElementById('scoreX').innerText = scoreX;
                document.getElementById('scoreO').innerText = scoreO;
                roundNum.innerText = round;

                // Win check (Only handled by Master player X to avoid double triggers)
                if(mySymbol === 'X' && active) {
                    const win = checkWin(board, 'X') ? 'X' : (checkWin(board, 'O') ? 'O' : null);
                    if(win) {
                        active = false;
                        db.ref('rooms/' + gameId).update({ winner: win });
                    } else if (board.every(v => v)) {
                        active = false;
                        db.ref('rooms/' + gameId).update({ winner: 'draw' });
                    }
                }

                if(data.winner) {
                    showWinOverlay(data.winner);
                }
            });
        }

        function showWinOverlay(p) {
            active = false;
            if(p === 'draw') {
                winIcon.innerHTML = ""; winText.innerText = "НИЧЬЯ";
            } else {
                winIcon.innerHTML = p === 'X' ? svgX : svgO;
                winText.innerText = p === mySymbol ? "ПОБЕДА" : "ПОРАЖЕНИЕ";
            }
            winOverlay.classList.add('active');
            if(mySymbol === 'X') {
                setTimeout(() => {
                    const nextTurn = 'X';
                    db.ref('rooms/' + gameId).update({
                        board: Array(9).fill(""), 
                        turn: nextTurn, 
                        winner: null,
                        round: round + 1,
                        scoreX: p === 'X' ? scoreX + 1 : scoreX,
                        scoreO: p === 'O' ? scoreO + 1 : scoreO
                    });
                    active = true;
                }, 2500);
            } else {
                setTimeout(() => { winOverlay.classList.remove('active'); active = true; board = Array(9).fill(null); }, 2600);
            }
        }

        // LOCAL GAME LOGIC
        modeBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                if (this.dataset.mode === currentMode) return;
                modeBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                syncGlider(this);
                currentMode = this.dataset.mode;
                hardReset();
            });
        });

        function executeMove(i, p) {
            if(isOnline) {
                if(turn !== mySymbol || board[i]) return;
                const newBoard = [...board].map(v => v === null ? "" : v);
                newBoard[i] = mySymbol;
                db.ref('rooms/' + gameId).update({ board: newBoard, turn: mySymbol === 'X' ? 'O' : 'X' });
                return;
            }

            board[i] = p;
            cells[i].innerHTML = p === 'X' ? svgX : svgO;
            cells[i].classList.add('occupied');

            if (checkWin(board, p)) return endGame(p);
            if (board.every(v => v)) return autoResetDraw();

            turn = turn === 'X' ? 'O' : 'X';
            active = true;
        }

        function autoResetDraw() { active = false; setTimeout(() => { round++; updateRoundUI(); clearField(); }, 1000); }

        function endGame(p) {
            active = false;
            p === 'X' ? scoreX++ : scoreO++;
            document.getElementById('scoreX').innerText = scoreX;
            document.getElementById('scoreO').innerText = scoreO;
            winIcon.innerHTML = p === 'X' ? svgX : svgO;
            winText.innerText = currentMode === 'god' ? (p === 'X' ? "ТЫ ПРОИГРАЛ" : "ТЫ ПОБЕДИЛ") : "ПОБЕДА";
            winOverlay.classList.add('active');
            setTimeout(() => { round++; updateRoundUI(); winOverlay.classList.remove('active'); clearField(); }, 2500);
        }

        function aiAction() {
            let move;
            if (currentMode === 'easy') move = randomMove();
            else if (currentMode === 'god') move = antiMinimax(board, 'O').index;
            else if (currentMode === 'med') move = Math.random() > 0.5 ? minimax(board, 'O').index : randomMove();
            else move = minimax(board, 'O').index;
            if (move !== undefined) executeMove(move, 'O');
        }

        function checkWin(b, p) {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return wins.some(w => w.every(i => b[i] === p));
        }

        // ALGORITHMS (Minimax / Anti-Minimax)
        function minimax(nb, p) {
            const avail = nb.map((v, i) => v === null ? i : null).filter(v => v !== null);
            if (checkWin(nb, 'X')) return { score: -10 };
            if (checkWin(nb, 'O')) return { score: 10 };
            if (avail.length === 0) return { score: 0 };
            const moves = [];
            for (let i = 0; i < avail.length; i++) {
                let move = { index: avail[i] };
                nb[avail[i]] = p;
                move.score = minimax(nb, p === 'O' ? 'X' : 'O').score;
                nb[avail[i]] = null;
                moves.push(move);
            }
            let best;
            if (p === 'O') { let bs = -Infinity; moves.forEach((m, i) => { if (m.score > bs) { bs = m.score; best = i; } }); }
            else { let bs = Infinity; moves.forEach((m, i) => { if (m.score < bs) { bs = m.score; best = i; } }); }
            return moves[best];
        }

        function antiMinimax(nb, p) {
            const avail = nb.map((v, i) => v === null ? i : null).filter(v => v !== null);
            if (checkWin(nb, 'X')) return { score: 10 }; 
            if (checkWin(nb, 'O')) return { score: -10 }; 
            if (avail.length === 0) return { score: 0 };
            const moves = [];
            for (let i = 0; i < avail.length; i++) {
                let move = { index: avail[i] };
                nb[avail[i]] = p;
                move.score = antiMinimax(nb, p === 'O' ? 'X' : 'O').score;
                nb[avail[i]] = null;
                moves.push(move);
            }
            let best;
            if (p === 'O') { let bs = -Infinity; moves.forEach((m, i) => { if (m.score > bs) { bs = m.score; best = i; } }); }
            else { let bs = Infinity; moves.forEach((m, i) => { if (m.score < bs) { bs = m.score; best = i; } }); }
            return moves[best];
        }

        function randomMove() { const avail = board.map((v, i) => v === null ? i : null).filter(v => v !== null); return avail[Math.floor(Math.random() * avail.length)]; }
        function updateRoundUI() { roundNum.classList.remove('round-change'); void roundNum.offsetWidth; roundNum.innerText = round; roundNum.classList.add('round-change'); }
        function clearField() { board = Array(9).fill(null); turn = 'X'; active = true; cells.forEach(c => { c.innerHTML = ''; c.classList.remove('occupied'); }); }
        function hardReset() { if(isOnline) return; scoreX = 0; scoreO = 0; round = 1; document.getElementById('scoreX').innerText = 0; document.getElementById('scoreO').innerText = 0; updateRoundUI(); winOverlay.classList.remove('active'); clearField(); }

        cells.forEach(c => c.addEventListener('click', () => {
            if (!active || board[c.dataset.idx]) return;
            executeMove(c.dataset.idx, turn);
            if (active && !isOnline && currentMode !== 'pvp') {
                active = false;
                setTimeout(aiAction, 400);
            }
        }));
    </script>
</body>
</html>
