<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quick Firebase Chat</title>
    <style>
        :root {
            --primary: #8b5cf6;
            --bg: #0b0f1a;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
        }

        #chat-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }

        .header {
            padding: 15px;
            background: rgba(0,0,0,0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .btn {
            background: var(--border);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .btn-primary { background: var(--primary); }
        .btn-danger { background: #ef4444; }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            border: 1px solid transparent;
            max-width: 90%;
            cursor: pointer;
            user-select: none; /* Предотвращает системное выделение синим */
            transition: 0.2s;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Стиль выделенного сообщения */
        .message.selected {
            border-color: var(--primary);
            background: rgba(139, 92, 246, 0.2);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }

        .input-area {
            padding: 15px;
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.2);
        }

        input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 10px;
            color: white;
            outline: none;
        }

        #toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="toast">Текст скопирован!</div>

    <div id="chat-container">
        <header class="header">
            <span>Чат 123</span>
            <div style="display: flex; gap: 8px;">
                <button class="btn" id="copy-selected">Скопировать</button>
                <button class="btn btn-danger" id="clear-all">Очистить</button>
            </div>
        </header>

        <div id="messages"></div>

        <form class="input-area" id="chat-form">
            <input type="text" id="msg-input" placeholder="Двойной клик на текст для выбора..." required>
            <button type="submit" class="btn btn-primary">Отправить</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, onValue, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBTcH3_tri2L7AHLh1e-YD-0s-QSthuE6Q",
            authDomain: "disk-c98ee.firebaseapp.com",
            projectId: "disk-c98ee",
            storageBucket: "disk-c98ee.appspot.com",
            messagingSenderId: "59577059636",
            appId: "1:59577059636:web:e98f456d054cc360747d61",
            databaseURL: "https://disk-c98ee-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, 'chat_messages');

        const messagesDiv = document.getElementById('messages');
        let selectedText = "";

        // Отправка
        document.getElementById('chat-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('msg-input');
            if (input.value.trim()) {
                push(messagesRef, { text: input.value, timestamp: serverTimestamp() });
                input.value = '';
            }
        });

        // Получение и логика двойного клика
        onChildAdded(messagesRef, (snap) => {
            const msg = document.createElement('div');
            msg.className = 'message';
            msg.textContent = snap.val().text;

            // ДВОЙНОЙ КЛИК (Выделение)
            msg.addEventListener('dblclick', () => {
                document.querySelectorAll('.message').forEach(m => m.classList.remove('selected'));
                msg.classList.add('selected');
                selectedText = msg.textContent;
            });

            // Для мобильных (эмуляция двойного тапа)
            let lastTap = 0;
            msg.addEventListener('touchend', (e) => {
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTap;
                if (tapLength < 300 && tapLength > 0) {
                    msg.dispatchEvent(new Event('dblclick'));
                }
                lastTap = currentTime;
            });

            messagesDiv.appendChild(msg);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

        // КНОПКА СКОПИРОВАТЬ
        document.getElementById('copy-selected').addEventListener('click', () => {
            if (selectedText) {
                navigator.clipboard.writeText(selectedText).then(() => {
                    const toast = document.getElementById('toast');
                    toast.style.display = 'block';
                    setTimeout(() => toast.style.display = 'none', 2000);
                });
            } else {
                alert("Сначала нажми дважды на сообщение!");
            }
        });

        // ОЧИСТКА
        document.getElementById('clear-all').addEventListener('click', () => {
            if (confirm("Удалить всё?")) set(messagesRef, null);
        });

        onValue(messagesRef, (snap) => { if (!snap.exists()) messagesDiv.innerHTML = ''; });
    </script>
</body>
</html>
